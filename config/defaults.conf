# Default configuration for Alpine WSL build
# This file contains default values that can be overridden by .env file

# Distribution name
DEFAULT_DISTRIBUTION_NAME="alp2"

# Alpine version
ALPINE_VERSION="v3.18"
ALPINE_ARCH="x86_64"

# Build directories
BUILD_DIR="/tmp/alpine-wsl-build"
CACHE_DIR="${HOME}/.cache/alpine-wsl"

# Package selections
BASE_PACKAGES="alpine-base"
EDITOR_PACKAGES="helix vim nano"
TOOL_PACKAGES="fd bat zoxide fzf ripgrep"
EXTRA_PACKAGES="git curl wget htop tree"
DOCKER_PACKAGES="docker docker-compose"

# Compression settings
COMPRESSION_LEVEL="--fast"

# Features
SYSTEMD_ENABLED="false"
DOCKER_ENABLED="true"
CLAUDE_CODE_ENABLED="true"
DEVELOPMENT_ENABLED="true"

# URLs
ALPINE_MIRROR="https://dl-cdn.alpinelinux.org/alpine"
MINIROOTFS_BASE_URL="${ALPINE_MIRROR}/${ALPINE_VERSION}/releases/${ALPINE_ARCH}"

# Module settings
DEFAULT_MODULES="base"
OPTIONAL_MODULES="docker claude-code development"